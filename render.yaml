services:
  - type: web
    name: placementgap-app
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    disk:
      name: placementgap-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: PLACEMENTGAP_WEB_DIST
        value: /opt/placementgap/web/dist
      - key: PLACEMENTGAP_FIXTURES
        value: "1"
      - key: PLACEMENTGAP_USE_LLM
        value: "0"
      - key: PLACEMENTGAP_SQLITE_PATH
        value: /var/data/placementgap.sqlite3
      - key: PLACEMENTGAP_RUN_DB
        value: /var/data/runs.sqlite3
      - key: PLACEMENTGAP_RUN_FILES
        value: /var/data/runs
      - key: PLACEMENTGAP_AUTH_DB
        value: /var/data/auth.sqlite3
      - key: PLACEMENTGAP_AUTH_SECRET_FILE
        value: /var/data/auth.secret
      - key: PLACEMENTGAP_FETCH_CACHE
        value: /var/data/fetch_cache.sqlite3
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: placementgap-db
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: placementgap-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: OAUTH_REDIRECT_BASE
        fromService:
          type: web
          name: placementgap-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: MICROSOFT_FRONTEND_URL
        fromService:
          type: web
          name: placementgap-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: MICROSOFT_REDIRECT_BASE
        fromService:
          type: web
          name: placementgap-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: placementgap-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: MICROSOFT_TENANT_ID
        value: common
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_SSL
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

databases:
  - name: placementgap-db
    databaseName: placementgap
    plan: 0.1c-256mb
    region: singapore
    postgresMajorVersion: "16"
    diskSizeGB: 1
    ipAllowList: []
