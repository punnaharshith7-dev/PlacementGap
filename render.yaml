services:
  - type: web
    name: placementgap-app
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: PLACEMENTGAP_WEB_DIST
        value: /opt/placementgap/web/dist
      - key: PLACEMENTGAP_FIXTURES
        value: "1"
      - key: PLACEMENTGAP_USE_LLM
        value: "0"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: placementgap-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: OAUTH_REDIRECT_BASE
        fromService:
          type: web
          name: placementgap-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: MICROSOFT_FRONTEND_URL
        fromService:
          type: web
          name: placementgap-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: MICROSOFT_REDIRECT_BASE
        fromService:
          type: web
          name: placementgap-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: placementgap-app
          envVarKey: RENDER_EXTERNAL_URL
      - key: MICROSOFT_TENANT_ID
        value: common
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_SSL
        value: "false"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
