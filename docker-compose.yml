services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: placementgap
      POSTGRES_USER: placementgap
      POSTGRES_PASSWORD: placementgap
    ports:
      - "5432:5432"
    volumes:
      - placementgap_pg:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/001-placementgap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placementgap -d placementgap"]
      interval: 3s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/all-in-one:1.63.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://placementgap:placementgap@postgres:5432/placementgap
      PLACEMENTGAP_FIXTURES: "1"
      PLACEMENTGAP_USE_LLM: "0"
      PLACEMENTGAP_SQLITE_PATH: /app/data/placementgap.sqlite3
      PLACEMENTGAP_RUN_DB: /app/data/runs.sqlite3
      PLACEMENTGAP_RUN_FILES: /app/data/runs
      PLACEMENTGAP_AUTH_DB: /app/data/auth.sqlite3
      PLACEMENTGAP_AUTH_SECRET_FILE: /app/data/auth.secret
      APP_ENV: ${APP_ENV:-development}
      AUTH_SECRET: ${AUTH_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:5174}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://127.0.0.1:8000}
      MICROSOFT_FRONTEND_URL: ${MICROSOFT_FRONTEND_URL:-http://127.0.0.1:5174}
      MICROSOFT_REDIRECT_BASE: ${MICROSOFT_REDIRECT_BASE:-http://127.0.0.1:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:5174}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - placementgap_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5174:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  placementgap_pg:
  placementgap_data:
  web_node_modules:
