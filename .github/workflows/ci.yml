name: PlacementGap CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: placementgap
          POSTGRES_USER: placementgap
          POSTGRES_PASSWORD: placementgap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U placementgap -d placementgap"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - name: Lint
        run: ruff check agent ontology api memory evals tests
      - name: Strict typecheck
        run: mypy --strict agent ontology
      - name: Unit, property, and integration tests
        run: pytest -q tests
      - name: Ontology aliases
        run: python -m evals.check_ontology_aliases
      - name: Web typecheck and build
        working-directory: web
        run: npm ci && npm run build
      - name: Fixture dev evaluation
        run: python -m evals.runner
        env:
          PLACEMENTGAP_FIXTURES: "1"
          PLACEMENTGAP_USE_LLM: "0"
      - name: Quality gate
        run: python -m evals.quality_gate
